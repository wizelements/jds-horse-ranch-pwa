name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run db:verify
      - run: node --check scripts/production-readiness.mjs
      - run: npm run type-check
      - run: npm run build
